<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>L’enquête de Damien · La sécurité en atelier</title>
<style>
:root{--bg:#f3f8ff;--card:#ffffff;--ink:#1f2937;--ok:#16a34a;--okbg:#dcfce7;--ko:#dc2626;--kobg:#fee2e2;--mc:#2563eb}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif;font-size:20px;line-height:1.45;-webkit-text-size-adjust:100%}
#app{max-width:860px;margin:0 auto;padding:16px}
.banner{border-radius:16px;padding:14px 18px;color:#fff;font-weight:bold;font-size:22px;display:flex;align-items:center;gap:10px}
.prog{height:12px;background:#dbe4f0;border-radius:8px;margin:12px 0;overflow:hidden}
.prog div{height:100%;background:#f59e0b;border-radius:8px;transition:width .4s}
.meta{display:flex;justify-content:space-between;font-size:17px;color:#475569}
.card{background:var(--card);border-radius:16px;padding:18px;margin:12px 0;box-shadow:0 2px 8px rgba(30,60,120,.10)}
.situ{background:#fff7e0;border-left:8px solid #f59e0b}
h1{font-size:34px;margin:6px 0}
h2{font-size:24px;margin:4px 0 10px}
.q{font-weight:bold;font-size:22px;margin-bottom:12px}
.opt{display:block;width:100%;text-align:left;font:inherit;background:#fff;border:3px solid #cbd5e1;border-radius:14px;padding:14px 16px;margin:10px 0;min-height:56px;cursor:pointer;color:var(--ink)}
.opt:active{transform:scale(.99)}
.opt.sel{border-color:var(--mc);background:#e0ecff}
.opt.good{border-color:var(--ok);background:var(--okbg)}
.opt.bad{border-color:var(--ko);background:var(--kobg);opacity:.8}
.btn{font:inherit;font-weight:bold;border:0;border-radius:14px;padding:14px 26px;min-height:56px;background:var(--mc);color:#fff;cursor:pointer;margin-top:10px}
.btn.alt{background:#fff;color:var(--mc);border:3px solid var(--mc)}
.btn:disabled{background:#94a3b8}
.fb{margin-top:12px;padding:12px 14px;border-radius:12px;font-size:19px}
.fb.good{background:var(--okbg);border:2px solid var(--ok)}
.fb.bad{background:var(--kobg);border:2px solid var(--ko)}
.hint{background:#eef2ff;border:2px dashed #818cf8;border-radius:12px;padding:10px 14px;margin-top:10px;font-size:18px}
.pic{display:block;max-width:100%;max-height:260px;margin:8px auto;border-radius:12px;border:2px solid #e2e8f0;background:#fff}
.picrow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.picrow .pic{max-height:200px}
input[type=text]{font:inherit;font-size:24px;width:100%;padding:12px 14px;border:3px solid #cbd5e1;border-radius:14px;margin-top:8px}
.big{font-size:26px;font-weight:bold;text-align:center;padding:22px 14px;background:#f8fafc;border:3px solid #cbd5e1;border-radius:16px;margin-bottom:10px}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.slots{margin:8px 0}
.slot{display:flex;gap:10px;align-items:flex-start;background:var(--okbg);border:2px solid var(--ok);border-radius:12px;padding:10px 12px;margin:8px 0}
.slot b{background:var(--ok);color:#fff;border-radius:50%;min-width:34px;height:34px;display:flex;align-items:center;justify-content:center}
.shake{animation:sh .35s}
@keyframes sh{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.mode{display:inline-block;background:#eef2ff;border-radius:20px;padding:4px 12px;font-size:17px;margin-bottom:6px}
.score{font-size:54px;font-weight:bold;text-align:center;color:var(--mc)}
.rank{font-size:28px;text-align:center;font-weight:bold}
table{width:100%;border-collapse:collapse;font-size:19px}
td{padding:8px;border-bottom:1px solid #e2e8f0}
.retiens{display:flex;gap:14px;align-items:flex-start;background:#ecfdf5;border:3px solid #34d399}
.retiens img{width:120px;border-radius:12px;flex:none}
.retiens ul{margin:6px 0;padding-left:22px}
@media(max-width:600px){body{font-size:18px}.retiens{flex-direction:column;align-items:center}}
</style>
</head>

 {t:"Non : il ne respecte pas les règles de sécurité, on ne court pas dans l’atelier.",ok:1},
 {t:"Oui : il est pressé de finir son travail.",ok:0},
 {t:"Non : il n’aurait pas dû marcher sur le carrelage.",ok:0}]},
{m:2,k:"mcq",q:"Les élèves souhaitent fêter les 18 ans d’un camarade, ils apportent de l’alcool en atelier. Cette attitude est-elle conforme ?",exp:"L’introduction de produits alcoolisés dans l’établissement est interdite, même pour une occasion spéciale.",opts:[
 {t:"Non : l’introduction de produits alcoolisés dans l’établissement est interdite.",ok:1},
 {t:"Oui : l’élève a 18 ans, il est majeur.",ok:0},
 {t:"Non : il faut seulement demander la permission à un camarade.",ok:0}]}
];

// -------------------------------------------------- moteur
const S = {name:"",i:0,pts:0,max:0,perM:{1:[0,0],2:[0,0],3:[0,0]}};
const app = document.getElementById("app");
const shuffle = a => { a = a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
const stepMax = st => st.k==="sort" ? st.cards.length : st.k==="duo" ? 2 : 1;
const TOTAL = STEPS.reduce((a,s)=>a+stepMax(s),0);

function head(m){
  const done = STEPS.slice(0,S.i).length;
  return `<div class="meta"><b>🦺 Séance 1 : La sécurité en atelier</b></div><div class="banner" style="background:${M[m].c}">${M[m].e} ${M[m].t}</div>
  <div class="prog"><div style="width:${Math.round(done/STEPS.length*100)}%"></div></div>
  <div class="meta"><span>Question ${S.i+1} sur ${STEPS.length}</span><span></span></div>
  <span class="mode">🧑 Seul</span>`;
}
function images(st){
  if(!st.imgs) return "";
  return `<div class="picrow">`+st.imgs.map(k=>`<img class="pic" src="${IMG[k]}" alt="Image de la situation">`).join("")+`</div>`;
}
function finishStep(st, earned){
  S.pts += earned; S.max += stepMax(st);
  S.perM[st.m][0] += earned; S.perM[st.m][1] += stepMax(st);
}
function nextBtn(st, earned){
  const last = S.i === STEPS.length-1;
  const b = document.createElement("button");
  b.className="btn"; b.textContent = last ? "Voir mon résultat 🏁" : "Question suivante ➜";
  b.onclick = () => { finishStep(st, earned()); S.i++; S.i<STEPS.length ? render() : result(); window.scrollTo(0,0); };
  return b;
}

function render(){
  const st = STEPS[S.i];
  let html = head(st.m);
  if(st.ctx) html += `<div class="card situ"><b>📋 Situation professionnelle</b><br>${esc(SITU)}</div>`;
  html += `<div class="card"><div class="q">${esc(st.q)}</div>${images(st)}<div id="zone"></div><div id="fb"></div><div id="nx"></div></div>`;
  app.innerHTML = html;
  ({mcq:doMcq,multi:doMulti,sort:doSort,order:doOrder,duo:doDuo})[st.k](st);
}

// --- QCM
function doMcq(st){
  const zone = document.getElementById("zone"), fb=document.getElementById("fb"), nx=document.getElementById("nx");
  let tried=false, locked=false;
  shuffle(st.opts).forEach(o=>{
    const b=document.createElement("button"); b.className="opt"; b.textContent=o.t;
    b.onclick=()=>{
      if(locked||b.disabled) return;
      if(o.ok){ locked=true; b.classList.add("good");
        fb.innerHTML=`<div class="fb good">✅ ${tried?"C’est ça !":"Bravo !"} ${esc(st.exp||"")}</div>`;
        nx.appendChild(nextBtn(st,()=>tried?0:1));
      } else { tried=true; b.classList.add("bad"); b.disabled=true;
        fb.innerHTML=`<div class="fb bad">❌ Pas tout à fait. Relis bien la situation et essaie une autre réponse.</div>`; }
    };
    zone.appendChild(b);
  });
}

// --- danger puis prévention
function doDuo(st){
  const zone = document.getElementById("zone"), fb=document.getElementById("fb"), nx=document.getElementById("nx");
  let earned=0;
  function stage(def, then){
    const box=document.createElement("div");
    box.innerHTML=`<div class="q" style="margin-top:12px">${esc(def.q)}</div>`;
    let tried=false, locked=false;
    shuffle(def.opts).forEach(o=>{
      const b=document.createElement("button"); b.className="opt"; b.textContent=o.t;
      b.onclick=()=>{
        if(locked||b.disabled) return;
        if(o.ok){ locked=true; b.classList.add("good"); if(!tried) earned++; fb.innerHTML=""; then(); }
        else { tried=true; b.classList.add("bad"); b.disabled=true;
          fb.innerHTML=`<div class="fb bad">❌ Pas tout à fait. Regarde bien l’image et essaie une autre réponse.</div>`; }
      };
      box.appendChild(b);
    });
    zone.appendChild(box);
  }
  stage(st.risk, ()=>stage(st.prev, ()=>{
    fb.innerHTML=`<div class="fb good">✅ Carte complétée ! ${esc(st.exp||"")}</div>`;
    nx.appendChild(nextBtn(st,()=>earned));
  }));
}

// --- plusieurs bonnes réponses
function doMulti(st){
  const zone = document.getElementById("zone"), fb=document.getElementById("fb"), nx=document.getElementById("nx");
  const n = st.opts.filter(o=>o.ok).length;
  zone.innerHTML = `<div class="hint">👉 Il y a <b>${n} bonnes réponses</b>. Touche pour sélectionner, puis valide.</div>`;
  let tried=false, locked=false;
  const sel = new Set();
  const btns = shuffle(st.opts).map(o=>{
    const b=document.createElement("button"); b.className="opt"; b.textContent=o.t;
    b.onclick=()=>{ if(locked) return; if(sel.has(o)){sel.delete(o);b.classList.remove("sel");} else {sel.add(o);b.classList.add("sel");} };
    zone.appendChild(b); return [o,b];
  });
  const v=document.createElement("button"); v.className="btn"; v.textContent="Valider ✔";
  v.onclick=()=>{
    if(locked) return;
    const goodSel=[...sel].filter(o=>o.ok).length, badSel=sel.size-goodSel;
    if(goodSel===n && badSel===0){
      locked=true; v.disabled=true;
      btns.forEach(([o,b])=>{ b.classList.remove("sel"); b.classList.add(o.ok?"good":"bad"); });
      fb.innerHTML=`<div class="fb good">✅ ${tried?"C’est ça !":"Bravo !"} ${esc(st.exp||"")}</div>`;
      nx.appendChild(nextBtn(st,()=>tried?0:1));
    } else {
      tried=true; zone.classList.add("shake"); setTimeout(()=>zone.classList.remove("shake"),400);
      fb.innerHTML=`<div class="fb bad">❌ Tu as trouvé ${goodSel} bonne${goodSel>1?"s":""} réponse${goodSel>1?"s":""} sur ${n}${badSel?`, mais il y a au moins une erreur`:`, mais il en manque`}. Change ta sélection et revalide.</div>`;
    }
  };
  zone.appendChild(v);
}

// --- classer des cartes
function doSort(st){
  const zone = document.getElementById("zone"), fb=document.getElementById("fb"), nx=document.getElementById("nx");
  const cards = shuffle(st.cards); let k=0, earned=0, missed=false;
  function show(){
    fb.innerHTML="";
    if(k>=cards.length){
      zone.innerHTML=`<div class="fb good">✅ Toutes les règles sont rangées. Tu les retrouveras dans ton règlement intérieur.</div>`;
      nx.appendChild(nextBtn(st,()=>earned)); return;
    }
    zone.innerHTML=`<div class="meta"><span>Règle ${k+1} sur ${cards.length}</span></div><div class="big" id="card">${esc(cards[k].t)}</div><div class="cats" id="cats"></div>`;
    st.cats.forEach(c=>{
      const b=document.createElement("button"); b.className="opt"; b.textContent=c.t;
      b.onclick=()=>{
        if(c.id===cards[k].c){ if(!missed) earned++; missed=false; b.classList.add("good"); k++; setTimeout(show,450); }
        else { missed=true; b.classList.add("bad"); b.disabled=true; fb.innerHTML=`<div class="fb bad">❌ Ce n’est pas la bonne catégorie. Essaie une autre.</div>`; }
      };
      document.getElementById("cats").appendChild(b);
    });
  }
  show();
}

// --- remettre dans l'ordre
function doOrder(st){
  const zone = document.getElementById("zone"), fb=document.getElementById("fb"), nx=document.getElementById("nx");
  zone.innerHTML=`<div class="hint">👉 Touche les gestes <b>dans l’ordre</b>, du premier au dernier.</div><div class="slots" id="slots"></div><div id="pool"></div>`;
  let next=0, missed=false;
  shuffle(st.items.map((t,i)=>({t,i}))).forEach(o=>{
    const b=document.createElement("button"); b.className="opt"; b.textContent=o.t;
    b.onclick=()=>{
      if(b.disabled) return;
      if(o.i===next){
        b.remove(); next++;
        const d=document.createElement("div"); d.className="slot"; d.innerHTML=`<b>${next}</b><span>${esc(o.t)}</span>`;
        document.getElementById("slots").appendChild(d); fb.innerHTML="";
        if(next===st.items.length){
          fb.innerHTML=`<div class="fb good">✅ ${missed?"C’est ça !":"Bravo !"} Dans l’ordre : Protéger, Examiner, Alerter, Secourir. Je ne m’expose jamais au danger.</div>`;
          nx.appendChild(nextBtn(st,()=>missed?0:1));
        }
      } else { missed=true; b.classList.add("bad","shake"); setTimeout(()=>b.classList.remove("bad","shake"),500);
        fb.innerHTML=`<div class="fb bad">❌ Ce n’est pas encore le bon moment pour ce geste. Que faut-il faire en premier ?</div>`; }
    };
    document.getElementById("pool").appendChild(b);
  });
}

// --- écrans début / fin
function intro(){
  app.innerHTML=`<div class="banner" style="background:#2563eb">🦺 Séquence 2 · Séance 1</div>
  <div class="card"><h1>L’enquête de Damien</h1>
  <h2>La sécurité en atelier</h2>
  <p>Tu es enquêteur. Ta mission : comprendre ce qui s’est passé avec Damien, puis retrouver les règles de l’atelier.</p>
  <div class="card situ"><b>📋 Situation professionnelle</b><br>${esc(SITU)}</div>
  <p>🎯 <b>2 missions</b>. Si tu te trompes, ce n’est pas grave : tu peux réessayer.</p>
  <label for="nm"><b>Ton prénom :</b></label>
  <input id="nm" type="text" autocomplete="off" placeholder="Écris ton prénom ici">
  <button class="btn" id="go">Commencer l’enquête ➜</button><div id="fb"></div></div>`;
  document.getElementById("go").onclick=()=>{
    const v=document.getElementById("nm").value.trim();
    if(!v){ document.getElementById("fb").innerHTML=`<div class="fb bad">✏️ Écris ton prénom avant de commencer.</div>`; return; }
    S.name=v; S.i=0; S.pts=0; S.max=0; S.perM={1:[0,0],2:[0,0],3:[0,0]}; render();
  };
}
function result(){
  app.innerHTML=`<div class="meta"><b>🦺 Séance 1 : La sécurité en atelier</b></div><div class="banner" style="background:#16a34a">🏁 Bravo ${esc(S.name)} !</div>
  <div class="card"><h2>Tu es arrivé(e) au bout de l’enquête de Damien.</h2>
  <p>Tu as retrouvé les règles de l’atelier.</p>
  <p><b>👂 Maintenant, tu peux écouter ton professeur pour la suite de la séance.</b></p>
  <button class="btn alt" id="again">Rejouer 🔁</button></div>`;
  document.getElementById("again").onclick=intro; window.scrollTo(0,0);
}
intro();
</script>
